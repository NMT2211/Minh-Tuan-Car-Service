<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cách kiểm tra xe trước khi thuê</title>
  <desc id="desc">Ảnh minh họa kiểm tra xe trước khi thuê để tránh phát sinh chi phí.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8f1dc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ab646"/>
      <stop offset="100%" stop-color="#006f24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <rect x="74" y="78" width="1052" height="518" rx="34" fill="#ffffff"/>
  <rect x="112" y="118" width="446" height="438" rx="30" fill="url(#panel)"/>
  <text x="156" y="192" fill="#d8f47a" font-size="26" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">KIỂM TRA XE TRƯỚC KHI THUÊ</text>
  <text x="156" y="280" fill="#ffffff" font-size="56" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">Tránh phát sinh</text>
  <text x="156" y="344" fill="#ffffff" font-size="56" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">chi phí</text>
  <text x="156" y="434" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">Ngoại thất, nội thất, lốp, cảm biến</text>
  <text x="156" y="468" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">và biên bản bàn giao rõ ràng.</text>
  <g transform="translate(652 144)">
    <circle cx="112" cy="112" r="88" fill="#eff8f1"/>
    <circle cx="112" cy="112" r="56" fill="#0a8f38"/>
    <rect x="210" y="206" width="196" height="114" rx="22" fill="#eff8f1"/>
    <rect x="210" y="346" width="196" height="50" rx="18" fill="#eff8f1"/>
    <path d="M170 174l62 62" stroke="#183326" stroke-width="18" stroke-linecap="round"/>
    <path d="M92 112h40" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M112 92v40" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
