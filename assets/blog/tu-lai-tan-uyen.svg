  <title id="title">Cho thuê xe tự lái Tân Uyên</title>
  <desc id="desc">Ảnh minh họa cẩm nang thuê xe tự lái tại Tân Uyên, Bình Dương.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f9ee"/>
      <stop offset="50%" stop-color="#f8fffb"/>
      <stop offset="100%" stop-color="#cdeccf"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08b344"/>
      <stop offset="100%" stop-color="#006f24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <circle cx="1012" cy="148" r="108" fill="#d8f2dc"/>
