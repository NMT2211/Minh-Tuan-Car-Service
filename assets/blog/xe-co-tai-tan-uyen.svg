<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Thuê xe có tài tại Tân Uyên</title>
  <desc id="desc">Ảnh minh họa dịch vụ thuê xe có tài tại Tân Uyên, Bình Dương.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fff8"/>
      <stop offset="100%" stop-color="#d5efd7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006f24"/>
      <stop offset="100%" stop-color="#0ab646"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <rect x="66" y="80" width="482" height="514" rx="34" fill="url(#panel)"/>
  <text x="112" y="156" fill="#d8f47a" font-size="26" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">THUÊ XE CÓ TÀI</text>
  <text x="112" y="232" fill="#ffffff" font-size="60" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">Tân Uyên</text>
  <text x="112" y="308" fill="#ffffff" font-size="34" font-weight="600" font-family="'Be Vietnam Pro', Arial, sans-serif">Phù hợp cho những</text>
  <text x="112" y="356" fill="#ffffff" font-size="34" font-weight="600" font-family="'Be Vietnam Pro', Arial, sans-serif">trường hợp nào?</text>
  <text x="112" y="456" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">Đón khách, đi sân bay, đi tỉnh và</text>
  <text x="112" y="492" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">lịch trình cần tài xế chuyên nghiệp.</text>
  <g transform="translate(628 110)">
    <rect width="484" height="458" rx="34" fill="#ffffff" opacity=".94"/>
    <circle cx="240" cy="116" r="64" fill="#e8f6eb"/>
    <circle cx="240" cy="96" r="24" fill="#0a8f38"/>
