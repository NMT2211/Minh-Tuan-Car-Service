<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Thuê xe đi sân bay Tân Sơn Nhất từ Tân Uyên</title>
  <desc id="desc">Ảnh minh họa tuyến xe đi sân bay Tân Sơn Nhất từ Tân Uyên.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf8ef"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006f24"/>
      <stop offset="100%" stop-color="#0ab646"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <rect x="70" y="90" width="520" height="494" rx="34" fill="url(#card)"/>
  <text x="118" y="170" fill="#d8f47a" font-size="26" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">TUYẾN ĐƯỜNG PHỔ BIẾN</text>
  <text x="118" y="250" fill="#ffffff" font-size="58" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">Sân bay</text>
  <text x="118" y="314" fill="#ffffff" font-size="58" font-weight="700" font-family="'Be Vietnam Pro', Arial, sans-serif">Tân Sơn Nhất</text>
  <text x="118" y="378" fill="#ffffff" font-size="34" font-weight="600" font-family="'Be Vietnam Pro', Arial, sans-serif">từ Tân Uyên</text>
  <text x="118" y="470" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">Đặt lịch chủ động, đúng giờ,</text>
  <text x="118" y="504" fill="#ecfff2" font-size="24" font-weight="500" font-family="'Be Vietnam Pro', Arial, sans-serif">phù hợp chuyến bay sáng sớm hoặc khuya.</text>
  <g transform="translate(652 140)">
